; Oregon Trail — Hosyond ESP32-S3 2.8" touchscreen
; Flags pinned per HOSYOND_ESP32S3_TARGET.md §3 (confirmed-good on this board).

[platformio]
default_envs = hosyond-s3

[env:hosyond-s3]
platform = espressif32@6.6.0          ; MUST pin — newer core regresses on this board
board = esp32-s3-devkitc-1            ; MUST be plain id (no -n16r8v variant)
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1              ; hardware CDC/JTAG — stable serial number
    -DBOARD_HAS_PSRAM
    -DLGFX_USE_V1
    -DCORE_DEBUG_LEVEL=3
    -DOT_TARGET_DEVICE=1

board_build.arduino.memory_type = qio_opi    ; QIO flash + OPI (octal) PSRAM
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv        ; single 3 MB app, ~896 KB LittleFS

lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0

; ---------------------------------------------------------------------------
; Headless build of src/game/** on the host — pure C++, no Arduino. Runs the
; playthrough test:  pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17 -Isrc -DOT_TARGET_NATIVE=1
build_src_filter = -<*> +<game/>
test_framework = unity
test_build_src = true          ; compile src/game/ and link it into the test
test_filter = test_playthrough
